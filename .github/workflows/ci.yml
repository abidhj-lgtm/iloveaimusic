name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck (report only until the cleanup pass lands)
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://iloveaimusic.com